services:
  - type: web
    name: grow-with-code-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: grow-with-code-db, property: connectionString}
      - key: DATABASE_USER
        fromDatabase: {name: grow-with-code-db, property: user}
      - key: DATABASE_PASSWORD
        fromDatabase: {name: grow-with-code-db, property: password}
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
databases:
  - name: grow-with-code-db
