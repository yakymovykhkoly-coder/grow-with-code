server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gwc}
    username: ${DATABASE_USER:gwc}
    password: ${DATABASE_PASSWORD:gwc}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt-secret-base64: ${JWT_SECRET_BASE64}
  jwt-issuer: ${JWT_ISSUER:grow-with-code}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
